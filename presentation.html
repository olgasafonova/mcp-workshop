<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MCP Workshop - Presentation</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html { scroll-snap-type: y mandatory; }
    body { background: #000; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    .slide-holder {
      min-height: 100vh;
      min-height: 100svh;
      display: flex;
      align-items: center;
      justify-content: center;
      scroll-snap-align: start;
    }
    .slide-sizer {
      width: calc(1920px * var(--s, 0.5));
      height: calc(1080px * var(--s, 0.5));
      overflow: hidden;
    }
    .slide-sizer iframe {
      width: 1920px;
      height: 1080px;
      border: none;
      display: block;
      transform: scale(var(--s, 0.5));
      transform-origin: top left;
      pointer-events: none;
    }
    .progress {
      position: fixed;
      bottom: 0;
      left: 0;
      height: 3px;
      background: #E53935;
      transition: width 0.2s ease;
      z-index: 1000;
    }
    .counter {
      position: fixed;
      bottom: 10px;
      right: 14px;
      color: #777;
      font-size: 12px;
      font-variant-numeric: tabular-nums;
      z-index: 1000;
      pointer-events: none;
    }
    /* Phones in portrait: compact filmstrip instead of letterboxed screens */
    @media (max-width: 720px) and (orientation: portrait) {
      html { scroll-snap-type: y proximity; }
      .slide-holder { min-height: 0; padding: 1.5vw 0; }
      body { padding: 2vw 0; }
    }
  </style>
</head>
<body>
  <main id="deck"></main>
  <div class="progress" id="progress"></div>
  <div class="counter" id="counter"></div>
  <script>
    const slides = [
      'slides/slide-01-title.html',
      'slides/slide-02-problem.html',
      'slides/slide-03-rag-vs-mcp.html',
      'slides/slide-04-what-mcp-is.html',
      'slides/slide-05-three-parts.html',
      'slides/slide-06-what-servers-provide.html',
      'slides/slide-07-cloud-vs-local.html',
      'slides/slide-08-tier2-intro.html',
      'slides/slide-08b-get-claude-desktop.html',
      'slides/slide-09-demo-gleif.html',
      'slides/slide-10-demo-playwright.html',
      'slides/slide-11-config.html',
      'slides/slide-11b-install-gleif.html',
      'slides/slide-12-tier3-intro.html',
      'slides/slide-13-architecture.html',
      'slides/slide-14-patterns.html',
      'slides/slide-15-getting-started.html',
      'slides/slide-16-takeaways.html',
      'slides/slide-17-testimonial.html',
      'slides/slide-18-resources.html',
      'slides/slide-19-thankyou.html',
    ];

    const deck = document.getElementById('deck');
    slides.forEach((src, i) => {
      const holder = document.createElement('section');
      holder.className = 'slide-holder';
      const sizer = document.createElement('div');
      sizer.className = 'slide-sizer';
      const frame = document.createElement('iframe');
      frame.src = src;
      frame.loading = 'lazy';
      frame.title = 'Slide ' + (i + 1);
      sizer.appendChild(frame);
      holder.appendChild(sizer);
      deck.appendChild(holder);
    });

    function rescale() {
      const portrait = matchMedia('(max-width: 720px) and (orientation: portrait)').matches;
      const s = portrait
        ? window.innerWidth / 1920
        : Math.min(window.innerWidth / 1920, window.innerHeight / 1080);
      document.documentElement.style.setProperty('--s', s);
    }
    rescale();
    window.addEventListener('resize', rescale);

    const holders = Array.from(document.querySelectorAll('.slide-holder'));
    const progress = document.getElementById('progress');
    const counter = document.getElementById('counter');
    let current = 0;

    function update() {
      progress.style.width = ((current + 1) / slides.length * 100) + '%';
      counter.textContent = (current + 1) + ' / ' + slides.length;
    }
    update();

    const io = new IntersectionObserver(entries => {
      entries.forEach(e => {
        if (e.isIntersecting) {
          current = holders.indexOf(e.target);
          update();
        }
      });
    }, { threshold: 0.5 });
    holders.forEach(h => io.observe(h));

    function go(n) {
      const target = holders[Math.max(0, Math.min(holders.length - 1, n))];
      target.scrollIntoView({ behavior: 'smooth' });
    }

    document.addEventListener('keydown', e => {
      switch (e.key) {
        case 'ArrowRight': case 'ArrowDown': case ' ': case 'PageDown':
          e.preventDefault(); go(current + 1); break;
        case 'ArrowLeft': case 'ArrowUp': case 'PageUp':
          e.preventDefault(); go(current - 1); break;
        case 'Home': e.preventDefault(); go(0); break;
        case 'End': e.preventDefault(); go(holders.length - 1); break;
        case 'f': case 'F':
          if (document.fullscreenElement) document.exitFullscreen();
          else document.documentElement.requestFullscreen();
          break;
      }
    });
  </script>
</body>
</html>
